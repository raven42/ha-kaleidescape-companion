<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>Companion fictional UI review</title>
  <style>
    body {
      margin: 0;
    }
    aside {
      background: #183a30;
      color: white;
      padding: 12px 24px;
      font: 13px system-ui;
    }
    aside a {
      color: #c6f2df;
    }
  </style>
  <aside>
    UI test fixture · Fictional records · Changes stay in this page's memory ·
    <a href="?library=1">Administrator Library</a> ·
    <a href="?library=1&amp;role=reader">Household reader Library</a> ·
    <a href="?library=1&amp;titles=1200">1,200-title Library</a> ·
    <a href="?settings=1&amp;companion_page=settings">Settings workspace</a> ·
    <a href="?collection=1&amp;companion_page=library">Collection changes</a>
  </aside>
  <kaleidescape-panel></kaleidescape-panel>
  <script type="module">
    import "../src/ui/panel.ts";
    import {
      FixtureTransport,
      libraryTitle,
      playing,
      record,
    } from "../tests/fixture.ts";
    import { JournalClient } from "../src/core/api.ts";
    const parameters = new URLSearchParams(location.search);
    const transport = new FixtureTransport();
    if (parameters.get("database") === "1") {
      transport.databaseLibraryRows = [
        {
          id: "fictional-library-1",
          title: "The Fictional Voyage",
          source_id: "fictional-source",
          available: true,
        },
      ];
      transport.databaseFixtureTables.library_sources = [
        { id: "fictional-source", name: "Fictional server" },
      ];
      transport.databaseReferences.library = [
        { table: "library_sources", key: { id: "source_id" } },
      ];
      transport.databaseIncoming.library = [
        {
          table: "purchase_records",
          key: { library_id: "id" },
          items: [{ id: "a".repeat(64) }],
          more: false,
        },
        {
          table: "viewings",
          key: { library_title_id: "id" },
          items: [{ id: transport.records[0].id }],
          more: false,
        },
      ];
      transport.records[0] = {
        ...transport.records[0],
        library_title_id: "fictional-library-1",
      };
      transport.purchaseRecords = [
        {
          id: "a".repeat(64),
          title: "The Fictional Voyage",
          purchased_on: "2020-01-02",
          purchase_price: "$12.99",
          retail_price: "$24.99",
          order_id: "FICTIONAL-1",
          href: null,
          library_id: "fictional-library-1",
        },
      ];
    }
    transport.options.library_enabled =
      parameters.get("library") === "1" ||
      parameters.get("settings") === "1" ||
      parameters.get("collection") === "1";
    if (parameters.get("collection") === "1") {
      transport.options.library_allow_collection_add = true;
      transport.options.library_sync_collections = true;
      transport.libraryTitles[0].collections = ["Played", "Favorites"];
      transport.libraryTitles[2].collections = ["New"];
      if (parameters.get("unconfirmed") === "1") {
        transport.pendingAdds = [
          {
            request_id: "fictional-unconfirmed",
            title_id: transport.libraryTitles[0].id,
            title: transport.libraryTitles[0].title,
            collection: "WatchSoon",
          },
        ];
      }
      if (parameters.get("alerts") === "1") {
        transport.collectionJobs = [
          {
            request_id: "fictional-failed",
            title_id: transport.libraryTitles[0].id,
            group_id: transport.libraryTitles[0].id,
            title: transport.libraryTitles[0].title,
            collection: "WatchSoon",
            operation: "add",
            status: "failed",
            error: "library_timeout",
          },
        ];
      }
    }
    if (parameters.get("settings") === "1") {
      transport.credentialConfigured = true;
      transport.options.library_host = "cinema.example.test";
      transport.options.calendar_enabled = true;
      transport.options.calendar_entity = "calendar.movies";
      transport.blueprintStatuses.purchase_email.status = "outdated";
      transport.blueprintStatuses.purchase_email.installed_version = 7;
      transport.blueprintStatuses.metadata_schedule.status = "modified";
      transport.blueprintStatuses.calendar_schedule.status = "missing";
      transport.blueprintStatuses.calendar_schedule.installed_version = null;
    }
    transport.players = [playing()];
    const formats = [
      "4K Cinematic Dolby Vision",
      "HD",
      "4K HDR10 SDR Dolby Atmos",
    ];
    transport.libraryTitles.forEach((title, index) => {
      title.edition = formats[index % formats.length];
      title.is_recently_added = index !== 1;
      title.is_favorite = index !== 2;
    });
    if (parameters.get("formats") === "1") {
      const title = transport.libraryTitles[0];
      title.formats = ["4K", "Dolby Atmos"];
      transport.scannedFormats.set(title.id, ["4K"]);
      transport.automaticFormats.set(title.id, ["4K", "Dolby Atmos"]);
    }
    transport.libraryTitles.push(
      libraryTitle({
        id: "d".repeat(64),
        edition: "HD",
        year: 2025,
        synopsis: "A separate fictional version, grouped for browsing only.",
        duration_seconds: 6900,
      }),
    );
    transport.libraryGroups.set("a".repeat(64), "fictional-voyage");
    transport.libraryGroups.set("d".repeat(64), "fictional-voyage");
    transport.libraryTitles.push(
      libraryTitle({
        id: "e".repeat(64),
        year: 1995,
        directors: ["Original Fictional Director"],
        synopsis:
          "An independent same-name work, never grouped with the remake.",
      }),
    );
    const recordCount = Number(parameters.get("records"));
    if (
      Number.isInteger(recordCount) &&
      recordCount > 0 &&
      recordCount <= 1000
    ) {
      transport.records = Array.from({ length: recordCount }, (_, index) =>
        record({
          id: `00000000-0000-4000-8000-${String(index).padStart(12, "0")}`,
          title: `Fictional viewing ${String(index + 1).padStart(4, "0")}`,
        }),
      );
    }
    const titleCount = Number(parameters.get("titles"));
    if (Number.isInteger(titleCount) && titleCount >= 1 && titleCount <= 2000) {
      transport.libraryTitles = Array.from({ length: titleCount }, (_, index) =>
        libraryTitle({
          id: index.toString(16).padStart(64, "0"),
          title: `Fictional movie ${String(index + 1).padStart(4, "0")}`,
          year: 1980 + (index % 40),
          watched_status: ["watched", "unwatched", "in_progress"][index % 3],
          collections: ["Science Fiction"],
          edition: formats[index % formats.length],
          is_recently_added: index % 4 === 0,
          is_favorite: index % 5 === 0,
        }),
      );
    }
    // Give the movie-dialog comparison two linked fictional viewings and a
    // purchase, including one viewing linked to another version in the group.
    if (transport.libraryTitles.some((title) => title.id === "a".repeat(64))) {
      transport.records[0].title = "Voyage to Europa";
      transport.records[1].title = "Voyage to Europa";
      transport.viewingLinks.set(transport.records[0].id, "a".repeat(64));
      transport.viewingLinks.set(transport.records[1].id, "d".repeat(64));
      transport.libraryTitles[0].purchased_on = "2026-10-12";
      transport.libraryTitles[0].purchase_history = [
        {
          id: "f".repeat(64),
          title: "Voyage to Europa",
          purchased_on: "2026-10-12",
          purchase_price: "$9.99",
          retail_price: "$19.99",
          order_id: "FICTIONAL-ORDER",
          href: null,
        },
      ];
    }
    // Full-precision source data should display rounded without rewriting untouched fields.
    transport.records[0].started_at = "2026-10-24T19:15:00.123456Z";
    transport.records[0].ended_at = "2026-10-24T21:05:00.654321Z";
    const client = new JournalClient({
      async callWS(message) {
        const result = await transport.callWS(message);
        if (parameters.get("role") === "reader") {
          if (message.type === "kaleidescape_companion/info") {
            result.entries = result.entries.map((entry) => ({
              entry_id: entry.entry_id,
              dataset_id: entry.dataset_id,
              api_version: entry.api_version,
              revision: entry.revision,
              viewing_count: entry.viewing_count,
              library_enabled: entry.library_enabled,
              ui_defaults: entry.ui_defaults,
              permissions: { read: true, edit: false, export: false },
            }));
          } else if (message.type === "kaleidescape_companion/library/info") {
            return Object.fromEntries(
              [
                "title_count",
                "group_count",
                "name_count",
                "preferences_key",
                "collection_count",
                "revision",
                "last_synced_at",
                "collections_synced_at",
              ].map((key) => [key, result[key]]),
            );
          }
        }
        return result;
      },
      fetchWithAuth: transport.fetchWithAuth.bind(transport),
    });
    document.querySelector("kaleidescape-panel").client = client;
  </script>
</html>

name: Framework checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install 'ruff>=0.14,<1'
      - run: scripts/test --providers-only
      - run: ruff check custom_components/kaleidescape_companion/scrapers tests/scrapers
      - run: ruff format --check custom_components/kaleidescape_companion/scrapers tests/scrapers

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m scripts.src.check_pyk --reconstruct
      - run: python -m scripts.src.unittest_runner discover -s tests
      - run: python -m scripts.src.check_project
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: |
          for script in scripts/* scripts/src/*.sh; do
            if [[ -f "$script" ]] && head -n 1 "$script" | grep -q '^#!/usr/bin/env bash$'; then
              bash -n "$script"
            fi
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run lint:markdown
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run format:docs:check
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build:check

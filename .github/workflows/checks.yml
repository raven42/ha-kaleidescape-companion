name: Framework checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'ruff>=0.14,<1'
      - run: PYTHONPATH=custom_components/kaleidescape_companion python -m unittest discover -s tests/scrapers
      - run: ruff check custom_components/kaleidescape_companion/scrapers tests/scrapers
      - run: ruff format --check custom_components/kaleidescape_companion/scrapers tests/scrapers

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python dev/check_pyk.py custom_components/kaleidescape_companion/vendor
      - run: python dev/run_python_tests.py -v
      - run: python dev/check_project.py
      - run: ruff check .
      - run: ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:markdown
      - run: npm run format:docs:check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Verify packaged bundle matches source
        run: git diff --exit-code -- ../custom_components/kaleidescape_companion/ui/assets/panel.js

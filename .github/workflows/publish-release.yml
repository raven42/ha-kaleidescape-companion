name: Publish tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS validates only public repositories; retain the signal without
    # preventing GitHub release assets for the private alpha repository.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository readiness for HACS
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  publish:
    needs: [checks, hassfest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/setup
      - run: scripts/package
      - name: Inspect the prepared artifact
        run: scripts/package --inspect dist/kaleidescape-companion.tar.gz
      - name: Verify the tag matches the packaged version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/kaleidescape_companion/manifest.json"))["version"])')"
          test "$TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease assets
        if: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$TAG"
          dist/kaleidescape-companion.tar.gz
          dist/kaleidescape-companion.tar.gz.sha256
          dist/kaleidescape-companion.tar.gz.provenance.json
          --title "Kaleidescape Companion $VERSION"
          --generate-notes
          --prerelease
      - name: Publish release assets
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$TAG"
          dist/kaleidescape-companion.tar.gz
          dist/kaleidescape-companion.tar.gz.sha256
          dist/kaleidescape-companion.tar.gz.provenance.json
          --title "Kaleidescape Companion $VERSION"
          --generate-notes

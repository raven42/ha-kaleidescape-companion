# Version history:
# v1: Introduce a guarded scheduled calendar full sync automation.
# End version history
blueprint:
  name: Kaleidescape Companion - Schedule calendar full sync
  description: >-
    Run guarded Full Sync on a dedicated calendar. Full Sync and its dedicated
    calendar acknowledgement must first be enabled in Companion settings.
    Unmatched events can be deleted after repeated scans and a grace period.
    Blueprint version: 1.
  domain: automation
  input:
    time:
      name: Local time
      default: "03:00:00"
      selector:
        time:
triggers:
  - trigger: time
    at: !input time
actions:
  - action: kaleidescape_companion.calendar_full_sync
  - delay: "00:11:00"
  - action: kaleidescape_companion.calendar_full_sync
mode: single

import_purchase_email:
  name: Import purchase email
  description: Import a fetched or parsed Kaleidescape receipt into the library.
  fields:
    invoice:
      name: Purchase email
      description: >-
        Fetched email content and selected fields, or a parsed email object or
        JSON string containing the purchases array. Receipt diagnostics can
        include the message contents in Home Assistant logs.
      required: true
      selector:
        object:
refresh_metadata:
  name: Refresh metadata
  description: Refresh selected enabled scrapers for all movies or only missing data.
  fields:
    providers:
      name: Scrapers
      description: >-
        Provide a list such as ["tmdb", "kaleidescape"]. Omit or use [] to
        refresh all enabled scrapers; a comma-separated string is not accepted.
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - label: Kaleidescape store
              value: kaleidescape
            - label: TMDB
              value: tmdb
    only_missing:
      name: Only missing metadata
      description: >-
        Skip scrapers that already have data unless configured artwork is
        missing. In action YAML, missing_only is also accepted as an alias.
      default: false
      selector:
        boolean:
library_sync:
  name: Sync library
  description: Request a library sync when library sync is enabled.
calendar_full_sync:
  name: Run calendar full sync
  description: >-
    Request one guarded Full Sync pass on the configured dedicated calendar.
    Unmatched events can be deleted after repeated checks and a grace period.

database_cleanup:
  name: Clean up database
  description: Remove selected finalized operation histories and link missing artwork between matching Library editions.
  fields:
    calendar:
      name: Calendar reconciliation retention
      description: Days to retain finalized receipts; 0 keeps all history.
      default: 0
      selector:
        number:
          min: 0
          max: 3650
          mode: box
    collections:
      name: Collection change retention
      description: Days to retain finalized receipts; 0 keeps all history.
      default: 0
      selector:
        number:
          min: 0
          max: 3650
          mode: box
    playback:
      name: Playback control retention
      description: Days to retain finalized receipts; 0 keeps all history.
      default: 0
      selector:
        number:
          min: 0
          max: 3650
          mode: box

play_movie:
  name: Play movie
  description: >-
    Play an exact title from the synced Library on a discovered player. If the
    title has multiple versions, provide the exact Library version ID instead.
    Requires experimental Library playback to be enabled.
  fields:
    device_id:
      name: Player
      required: true
      selector:
        device:
          integration: kaleidescape_companion
    title:
      name: Movie title
      description: Exact Library title. Provide this or a version ID.
      selector:
        text:
    version_id:
      name: Library version ID
      description: Exact Library version ID. Provide this or a movie title.
      selector:
        text:

keyboard_character:
  name: Send keyboard character
  description: Send one printable ASCII character to a player's on-screen keyboard.
  fields:
    device_id:
      name: Player
      required: true
      selector:
        device:
          integration: kaleidescape_companion
    value:
      name: Character
      required: true
      selector:
        text:


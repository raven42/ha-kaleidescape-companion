[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaleidescape"
version = "0.0.0"
description = "Kaleidescape Companion: a Home Assistant journal, now-playing view, and library."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["pykaleidescape==1.2.0"]

[project.optional-dependencies]
dev = ["homeassistant==2026.11.0", "ruff>=0.14,<1"]
audit = ["pip-audit>=2.10.1,<3"]

[tool.setuptools]
# Use a filesystem path for editables: HA scans custom_components.__path__.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["custom_components", "custom_components.kaleidescape_companion*"]

[tool.setuptools.package-data]
"custom_components.kaleidescape_companion" = [
    "*.json", "services.yaml", "translations/*.json", "ui/assets/*.js",
    "templates/purchase_email_parser.yaml", "templates/library_schedule.yaml",
    "templates/metadata_schedule.yaml", "templates/calendar_schedule.yaml",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.kaleidescape_companion"]
known-third-party = ["homeassistant", "probatio"]

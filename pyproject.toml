[project]
name = "kaleidescape"
version = "0.0.0"
description = "Home Assistant framework for the Kaleidescape journal, now-playing view, and library."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.kaleidescape_companion"]
known-third-party = ["homeassistant", "voluptuous"]

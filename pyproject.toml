[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaleidescape-companion"
version = "0.5.0-alpha"
description = "Kaleidescape Companion: a Home Assistant journal, now-playing view, and library."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14.2"
dependencies = ["pykaleidescape==1.2.0"]

[project.urls]
Homepage = "https://github.com/raven42/ha-kaleidescape-companion"
Issues = "https://github.com/raven42/ha-kaleidescape-companion/issues"

[project.optional-dependencies]
dev = ["homeassistant==2026.11.0", "ruff>=0.14,<1"]
audit = ["pip-audit>=2.10.1,<3"]

[tool.setuptools]
# Use a filesystem path for editables: HA scans custom_components.__path__.
package-dir = {"" = "."}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["custom_components", "custom_components.kaleidescape_companion*"]

[tool.setuptools.package-data]
"custom_components.kaleidescape_companion" = [
    "LICENSE", "NOTICE", "*.json", "services.yaml", "translations/*.json", "ui/assets/*.js",
    "templates/purchase_email_parser.yaml", "templates/library_schedule.yaml",
    "templates/metadata_schedule.yaml", "templates/calendar_schedule.yaml",
    "templates/maintenance_schedule.yaml",
]
"custom_components.kaleidescape_companion.vendor.kaleidescape" = ["LICENSE", "py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["custom_components/kaleidescape_companion/vendor/kaleidescape"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.kaleidescape_companion"]
known-third-party = ["homeassistant", "probatio"]
